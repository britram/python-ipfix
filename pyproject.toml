[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ipfix"
version = "1.0.0"
description = "IPFIX (RFC 7011) implementation for Python"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Brian Trammell", email = "brian@trammell.ch" },
]
keywords = ["ipfix", "netflow", "rfc7011", "networking", "telemetry", "flow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/britram/python-ipfix"
Repository = "https://github.com/britram/python-ipfix"
Issues = "https://github.com/britram/python-ipfix/issues"

[project.scripts]
ipfix2csv = "ipfix.cli:main_ipfix2csv"
ipfixstat = "ipfix.cli:main_ipfixstat"

[project.optional-dependencies]
docs = ["sphinx>=7.0"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["ipfix"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=ipfix --cov-report=term-missing"
testpaths = ["tests", "ipfix"]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["ipfix"]
omit = ["ipfix/testutils.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
